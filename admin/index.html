<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club-Verwaltung · Wege & Ziele</title>
<link rel="stylesheet" href="../assets/portal.css">
</head>
<body>
<noscript><div role="alert" style="padding:18px;background:#fff3cd;color:#332600">Für Anmeldung und Ländercheck ist JavaScript erforderlich. Bitte aktiviere JavaScript und lade die Seite erneut.</div></noscript>
<script src="../assets/readiness.js"></script>
<main class="shell">
  <header class="top">
    <div class="brand">
      <h1>Club-Verwaltung</h1>
      <p>Technischer Veröffentlichungsstand</p>
    </div>
    <div class="userbox">
      <a class="btn btn-soft" href="../">← Portal</a>
    </div>
  </header>

  <section class="panel">
    <h2 style="margin-top:0">Maut & Länderinfo</h2>
    <div id="versionBox"></div>

    <h3>Länderstatus</h3>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>Land</th><th>Status</th><th>Geprüft</th><th>Revision</th></tr></thead>
        <tbody id="countries"></tbody>
      </table>
    </div>

    <p class="small">Dieser Bereich ist zunächst bewusst nur lesend. Veröffentlichung und redaktionelle Bearbeitung kommen im nächsten Schritt.</p>
  </section>
</main>

<script type="module">
try {
const { supabase, getSession, hasPermission } = await window.portalReady.loadAuth();

const session = await getSession();
if (!session || !(await hasPermission("admin:manage").catch(() => false))) {
  location.replace("../");
} else {
  const { data: s, error: settingsError } = await supabase
    .from("countrycheck_settings")
    .select("online_version,development_version,release_notes,published_at")
    .eq("app_key","countrycheck")
    .single();

  if (settingsError || !s) throw new Error("Versionsabfrage fehlgeschlagen");
  document.querySelector("#versionBox").textContent =
    `Online: ${s.online_version || "nicht festgelegt"} · Entwicklung: ${s.development_version || "nicht festgelegt"} · Stand: ${s.release_notes || "keine Angabe"}`;
  const { data: c, error: countriesError } = await supabase
    .from("countrycheck_countries")
    .select("iso_code,country_name,flag,publish_status,last_checked,content_revision")
    .order("country_name");

  if (countriesError) throw new Error("Länderstatus nicht verfügbar");
  const tbody = document.querySelector('#countries');
  for (const x of c || []) {
    const row = tbody.insertRow();
    for (const value of [String(x.flag || '') + ' ' + String(x.country_name || ''), x.publish_status, x.last_checked || '—', x.content_revision]) {
      row.insertCell().textContent = value ?? 'keine Angabe';
    }
  }
  if (!c?.length) document.querySelector('#versionBox').append(' · Keine Länderstatusdaten vorhanden.');

}
window.portalReady.done();
} catch { window.portalReady.fail(); }
</script>
</body>
</html>
